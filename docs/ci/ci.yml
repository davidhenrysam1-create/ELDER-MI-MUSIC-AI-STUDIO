# ─────────────────────────────────────────────────────────────────────────────
# TO ENABLE (one time, 30 seconds):
#   Copy this file to  .github/workflows/ci.yml  and commit it.
#   On GitHub you can do it in the browser: Add file → Create new file →
#   name it .github/workflows/ci.yml → paste this content → Commit.
#   Why it is not there already: the automation that wrote this repository is
#   not allowed to create workflow files, so the file is versioned here instead.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

# Proof, on every push and pull request, that a clean clone of this repository
# type-checks, passes its tests and builds — on Linux, macOS and Windows.
#
# This is the answer to "does it run on other machines?": not a claim in a README,
# but a job that would go red if it stopped being true. The matrix is deliberately
# small (one LTS on two platforms, two LTS on Linux) so it finishes quickly and
# stays free.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch: a newer push cancels the older run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 20
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` (not install) so the lockfile is what gets built.
      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # A production build is the step that catches missing modules, bad imports
      # and API routes that only fail when Next tries to bundle them.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # A container is the "runs on any machine" guarantee for people who do not have
  # Node installed. Built here so a broken Dockerfile is caught immediately.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: elder-mi-music-ai-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container and check it answers
        run: |
          # HEALTHCHECK in the Dockerfile probes /api/health, which answers
          # without a session or a database. Run with accounts ON: that is the
          # strictest case, and the probe must still get through.
          docker run -d --name studio -p 3000:3000 \
            -e ADMIN_EMAIL=ci@example.test \
            -e STUDIO_ACCOUNTS=on \
            elder-mi-music-ai-studio:ci
          # Give the server a moment, then fail loudly if it never answers.
          for i in $(seq 1 45); do
            body=$(curl -s http://localhost:3000/api/health || true)
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "container answered: $body"; exit 0
            fi
            sleep 2
          done
          echo "container did not answer /api/health"; docker logs studio; exit 1
